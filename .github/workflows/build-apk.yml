
name: Build Focus30 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Focus30Android_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip Focus30Android_Source.zip -d project

      - name: Build APK
        run: |
          cd project/Focus30Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus30-Debug-APK
          path: project/Focus30Android/app/build/outputs/apk/debug/app-debug.apk
          
